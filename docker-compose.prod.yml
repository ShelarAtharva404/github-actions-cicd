services:

  frontend:
    image: ghcr.io/shelaratharva404/taskmanager-frontend:latest
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/shelaratharva404/taskmanager-backend:latest
    container_name: taskmanager-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL}